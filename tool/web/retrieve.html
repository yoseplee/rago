<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rago API Web App - Retrieve</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .nav-button {
            background-color: #6c757d;
        }
        .nav-button:hover {
            background-color: #5a6268;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
        }
        .spinner {
            display: none;
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #007BFF;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<h1>Rago API Web App - Retrieve</h1>

<div class="container">
    <h2>Retrieve Documents</h2>
    <label for="retrieveIndexName">Index Name:</label>
    <select id="retrieveIndexName"></select>
    <label for="query">Query (for taking similar items from vector database):</label>
    <input type="text" id="query" placeholder="Enter query">
    <label for="message">Message (for prompting to the LLM model):</label>
    <input type="text" id="message" placeholder="Enter message">
    <button onclick="retrieveDocuments()">Retrieve</button>
    <div id="retrieveResult" class="result"></div>
    <div class="spinner" id="spinner"></div>
</div>

<div class="container">
    <button class="nav-button" onclick="goToCreateKnnIndex()">Go to Create kNN Index</button>
    <button class="nav-button" onclick="goToIngest()">Go to Ingest</button>
</div>

<script>
    const baseUrl = 'http://localhost:1323';

    async function fetchIndices() {
        try {
            const response = await fetch(`${baseUrl}/indices`);
            const data = await response.json();
            const select = document.getElementById('retrieveIndexName');
            data.indices.forEach(index => {
                const option = document.createElement('option');
                option.value = index;
                option.text = index;
                select.appendChild(option);
            });
        } catch (error) {
            console.error('Error fetching indices:', error);
        }
    }

    async function retrieveDocuments() {
        const indexName = document.getElementById('retrieveIndexName').value;
        const query = document.getElementById('query').value;
        const message = document.getElementById('message').value;
        const spinner = document.getElementById('spinner');
        spinner.style.display = 'block';

        try {
            const response = await fetch(`${baseUrl}/retrieve/${indexName}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ query, message })
            });
            const result = await response.json();
            document.getElementById('retrieveResult').innerText = JSON.stringify(result);
        } catch (error) {
            console.error('Error retrieving documents:', error);
        } finally {
            spinner.style.display = 'none';
        }
    }

    function goToCreateKnnIndex() {
        window.location.href = 'createKnnIndex.html';
    }

    function goToIngest() {
        window.location.href = 'ingest.html';
    }

    // Fetch indices when the page loads
    window.onload = function() {
        fetchIndices();
    };
</script>
</body>
</html>
