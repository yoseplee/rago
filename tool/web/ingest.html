<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rago API Web App - Ingest</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .nav-button {
            background-color: #6c757d;
        }
        .nav-button:hover {
            background-color: #5a6268;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
        }
        .document-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .document-item textarea {
            flex: 1;
        }
        .document-item button {
            margin-left: 10px;
        }
        .spinner {
            display: none;
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #007BFF;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<h1>Rago API Web App - Ingest</h1>

<div class="container">
    <h2>Ingest Documents</h2>
    <label for="ingestIndexName">Index Name:</label>
    <select id="ingestIndexName"></select>
    <div id="documentsContainer"></div>
    <button onclick="addDocument()">Add Document</button>
    <br>
    <button onclick="ingestDocuments()">Ingest</button>
    <div id="ingestResult" class="result"></div>
    <div class="spinner" id="spinner"></div>
</div>

<div class="container">
    <button class="nav-button" onclick="goToCreateKnnIndex()">Go to Create kNN Index</button>
    <button class="nav-button" onclick="goToRetrieve()">Go to Retrieve</button>
</div>

<script>
    const baseUrl = 'http://localhost:1323';

    async function fetchIndices() {
        try {
            const response = await fetch(`${baseUrl}/indices`);
            const data = await response.json();
            const select = document.getElementById('ingestIndexName');
            data.indices.forEach(index => {
                const option = document.createElement('option');
                option.value = index;
                option.text = index;
                select.appendChild(option);
            });
        } catch (error) {
            console.error('Error fetching indices:', error);
        }
    }

    function addDocument() {
        const container = document.getElementById('documentsContainer');
        const documentItem = document.createElement('div');
        documentItem.className = 'document-item';
        documentItem.innerHTML = `
            <textarea placeholder="Put your document here"></textarea>
            <button onclick="removeDocument(this)">Remove</button>
        `;
        container.appendChild(documentItem);
    }

    function removeDocument(button) {
        const documentItem = button.parentElement;
        documentItem.remove();
    }

    async function ingestDocuments() {
        const indexName = document.getElementById('ingestIndexName').value;
        const documents = Array.from(document.querySelectorAll('#documentsContainer textarea')).map(textarea => textarea.value);

        if (documents.some(doc => doc.trim() === "")) {
            alert("Please fill in all document fields before ingesting.");
            return;
        }

        const spinner = document.getElementById('spinner');
        spinner.style.display = 'block';

        try {
            const response = await fetch(`${baseUrl}/ingest/${indexName}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ documents })
            });
            const result = await response.json();
            document.getElementById('ingestResult').innerText = JSON.stringify(result);
        } catch (error) {
            console.error('Error ingesting documents:', error);
        } finally {
            spinner.style.display = 'none';
        }
    }

    function goToCreateKnnIndex() {
        window.location.href = 'createKnnIndex.html';
    }

    function goToRetrieve() {
        window.location.href = 'retrieve.html';
    }

    // Fetch indices when the page loads
    window.onload = function() {
        fetchIndices();
        addDocument();
    };
</script>
</body>
</html>
