<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rago API Web App - Create kNN Index</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
<h1>Rago API Web App - Create kNN Index</h1>

<div class="container">
    <h2>Create kNN Index</h2>
    <label for="indexName">Index Name:</label>
    <input type="text" id="indexName" placeholder="Enter index name">
    <button onclick="createKnnIndex()">Create Index</button>
    <div id="createIndexResult" class="result"></div>
</div>

<div class="container">
    <button onclick="goToIngest()">Go to Ingest</button>
    <button onclick="goToRetrieve()">Go to Retrieve</button>
</div>

<script>
    const baseUrl = 'http://localhost:1323';

    async function createKnnIndex() {
        const indexName = document.getElementById('indexName').value;
        const response = await fetch(`${baseUrl}/index/knn/${indexName}`, {
            method: 'POST'
        });
        const result = await response.json();
        document.getElementById('createIndexResult').innerText = JSON.stringify(result);
    }

    function goToIngest() {
        window.location.href = 'ingest.html';
    }

    function goToRetrieve() {
        window.location.href = 'retrieve.html';
    }
</script>
</body>
</html>
